services:
  frontend:
    image: nginx:1.29-alpine
    container_name: homework-frontend
    networks: [frontend-net]

  backend:
    image: alpine:3.22
    container_name: homework-backend
    command: ["sh", "-c", "sleep infinity"]
    networks: [frontend-net, backend-net]

  database:
    image: mysql:8.4
    container_name: homework-database
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M", "--max-connections=20"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demo-local-only}
    networks: [backend-net, isolated-net]

networks:
  frontend-net:
  backend-net:
  isolated-net:
